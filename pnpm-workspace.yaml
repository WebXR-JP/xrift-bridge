packages:
  - apps/*
  - packages/*
  - packages/plugins/*
  - tools/*
  - examples/*

catalogMode: prefer

# ADR: 依存の postinstall/native ビルドの許可表。pnpm 12 の `allowBuilds`
# （`onlyBuiltDependencies` 等の後継。`package.json` の `pnpm` 欄は読まれない）
# で表す。Angular スパイク（`@angular/build` 経由）が持ち込む4件に限る。
# いずれも `bridge-gui-ui` の dev 依存鎖（`ng:build:*` の実行に要る）であり、
# 実行時依存には含めない。`esbuild` は実行形式の導入、残り3件は CLI 道具鎖の
# native 解決に要る。列挙以外は既定拒否のままにし、むやみな全許可
# （`dangerouslyAllowAllBuilds`）はしない。変更時は `pnpm install` の終了と
# `ng:build:dev`／`ng:build:prod` の成功で確かめる。
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

catalog:
  "@types/bun": 1.4.0
  "@types/node": ^24
  "@types/ws": ^8.18.2
  happy-dom: ^20.14.5
  cross-env: 10.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  # ADR: 管理画面の意匠基盤（Tailwind v4＋spartan/ui）に使う外部依存。workspace
  # パッケージは catalog に載せない（`vp run -r build` の順序解決を壊すため）。
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  postcss: 8.5.30
  "@spartan-ng/brain": 1.6.3
  "@ng-icons/core": 33.4.0
  "@ng-icons/lucide": 33.4.0
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  tw-animate-css: 1.4.0
  # ADR: 公式 `@angular/build:unit-test`（Vitest runner）が `vitest` と DOM 環境の
  # 解決を要求するため catalog に載せる。版は lock 済みの解決（5.0.1 系）に固定し、
  # builder 検証済みの組み合わせから外さない。`bridge-gui-ui` の dev 依存に限る。
  vitest: 5.0.1
  ws: 8.22.0
  # ADR: 製品向けローカル業務操作 MCP（stable 包装を含む main プロセス内待受け）に
  # 使う外部依存。Hutch の stable 包装に取り込まれ、開発用の node_modules に
  # 依存せずに起動したアプリで往復できることをスパイクで確かめる。
  # 採用可否の判断材料であり、版は固定する（v0 台は版間の互換を考えない）。
  "@modelcontextprotocol/sdk": 1.32.1
  # ADR: 製品向け MCP の工具の入力検証と広告 schema を同じ定義に一本化するための
  # zod。`bridge-gui-main` の runtime 依存として `catalog:` 参照する。
  # 版は lock 済みの既存解決（4.6.5）に固定する。契約パッケージには入れない
  # （実行時依存を持てない）。
  zod: 4.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
