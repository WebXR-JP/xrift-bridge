<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>埋込み検証の子画面</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="spike">
      <h1>埋込み検証の子画面</h1>
      <dl>
        <div>
          <dt>マウント識別子</dt>
          <dd id="spike-mount">未取得</dd>
        </div>
        <div>
          <dt>取得した改訂番号</dt>
          <dd id="spike-revision">未取得</dd>
        </div>
        <div>
          <dt>push の受信回数</dt>
          <dd id="spike-pushes">0</dd>
        </div>
        <div>
          <dt>準備完了の通知</dt>
          <dd id="spike-ready">未通知</dd>
        </div>
      </dl>
      <p id="spike-error" class="error" aria-live="polite"></p>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
