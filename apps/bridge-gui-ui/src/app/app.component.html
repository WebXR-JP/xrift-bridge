<app-shell
  [views]="views"
  [selectedKey]="selectedKey()"
  [counts]="viewCounts"
  [status]="shellStatus"
  (selectRequested)="onSelectView($event)"
  (quitRequested)="onQuit()"
>
  <section data-panel="connections" [class.hidden]="selectedKey() !== 'connections'">
    <app-status-summary [snapshot]="snapshot()" />

    <app-acceptance-toggle
      [snapshot]="snapshot()"
      (enableRequested)="onEnable()"
      (disableRequested)="onDisable()"
    />

    <app-pending-list
      [pending]="snapshot()?.pending ?? []"
      [views]="pairingViews()"
      (showRequested)="onShowCode($event)"
      (approveRequested)="onApprove($event)"
      (rejectRequested)="onReject($event)"
    />

    <app-connection-list
      [connections]="snapshot()?.connections ?? []"
      (disconnectRequested)="onDisconnect($event)"
    />
  </section>

  <section data-panel="sessions" [class.hidden]="selectedKey() !== 'sessions'">
    <app-session-list [sessions]="snapshot()?.sessions ?? []" />
  </section>

  <section data-panel="plugins" [class.hidden]="selectedKey() !== 'plugins'">
    <app-plugin-list
      [kinds]="snapshot()?.plugins.kinds ?? []"
      [instances]="snapshot()?.plugins.instances ?? []"
      [assignments]="snapshot()?.plugins.assignments ?? []"
      [sessions]="snapshot()?.sessions ?? []"
      (assignRequested)="onAssignPlugin($event)"
      (unassignRequested)="onUnassignPlugin($event)"
    />
  </section>

  <section
    data-panel="operations"
    [class.hidden]="selectedKey() !== 'operations'"
    class="flex flex-col gap-4"
  >
    <app-plugin-operations
      [kinds]="snapshot()?.plugins.kinds ?? []"
      [instances]="snapshot()?.plugins.instances ?? []"
      [selectedInstanceId]="activeInstanceId()"
      [mounts]="snapshot()?.pluginMounts ?? []"
      [failures]="snapshot()?.pluginMountFailures ?? []"
      (selectionRequested)="onSelectPluginInstance($event)"
      (retryRequested)="onRetryPluginMounts()"
    />

    <section
      aria-label="埋込み子画面"
      class="flex flex-col gap-3"
      style="
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
      "
    >
      <h2 class="m-0 text-[15px] font-bold text-[var(--foreground)]">埋込み子画面</h2>
      <p class="m-0 text-[12px] text-[var(--muted-foreground)]">
        選択中インスタンスの子画面だけが見える。他は隠す。
      </p>
      <div #pluginHost id="plugin-host"></div>
    </section>

    <app-plugin-mounts
      [mounts]="snapshot()?.pluginMounts ?? []"
      [failures]="snapshot()?.pluginMountFailures ?? []"
      (retryRequested)="onRetryPluginMounts()"
    />

    <app-spike-section
      [spikes]="spikeMounts()"
      (createRequested)="onCreateSpike()"
      (pushRequested)="onPushSpike($event)"
      (destroyRequested)="onDestroySpike($event)"
      (resetRequested)="onResetSpikes()"
    />

    <div #spikeHost id="spike-host"></div>
  </section>

  <section data-panel="log" [class.hidden]="selectedKey() !== 'log'">
    <app-event-log [entries]="eventLog()" />
  </section>
</app-shell>
