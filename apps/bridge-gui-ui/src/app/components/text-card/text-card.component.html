<section class="card">
  <h2>テキスト送信</h2>
  <dl>
    <div>
      <dt>割当て先</dt>
      <dd>{{ assignmentText() }}</dd>
    </div>
    <div>
      <dt>段階</dt>
      <dd>{{ phaseText() }}</dd>
    </div>
  </dl>
  <div class="row">
    <button type="button" [disabled]="assigned" (click)="assignRequested.emit()">
      テキストを割り当てる
    </button>
    <button type="button" [disabled]="!canUnassign" (click)="onUnassign()">
      テキストの割当てを外す
    </button>
  </div>
  <p class="note">本文の入力と送信・状態の詳細は子画面で確認する。割当てと解除だけをここで行う。</p>
  @if (unreclaimed) {
    <p class="note">回収に失敗した所有が残っている。最終回収は本体の終了時に行う。</p>
  }
  @if (error()) {
    <p class="error" aria-live="polite">{{ error() }}</p>
  }
</section>
