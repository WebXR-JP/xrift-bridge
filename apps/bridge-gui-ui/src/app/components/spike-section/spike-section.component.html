<!-- 埋込み検証（段0スパイク。開発用の独立節。通常ナビには載せない）。 -->
<section class="flex flex-col gap-3" aria-label="埋込み検証">
  <h2 class="m-0 text-[15px] font-bold text-[var(--foreground)]">埋込み検証（段0スパイク）</h2>
  <p class="m-0 text-[12px] text-[var(--muted-foreground)]">
    検証用の小さな子画面を置き、往復と破棄を確かめる。実プラグインの結線はしない。
  </p>
  <div class="flex gap-2">
    <button hlmBtn variant="default" type="button" (click)="createRequested.emit()">
      子画面を作る
    </button>
    <button hlmBtn variant="outline" type="button" (click)="resetRequested.emit()">
      子画面を全て外す
    </button>
  </div>
  @if (spikes().length === 0) {
    <ul class="m-0 flex list-none flex-col p-0">
      <li class="m-0 text-[14px] text-[var(--muted-foreground)]">子画面は無い</li>
    </ul>
  } @else {
    <ul class="m-0 flex list-none flex-col gap-1 p-0">
      @for (mount of spikes(); track mount.mountId) {
        <li class="m-0 flex items-center gap-2 text-[12px] text-[var(--muted-foreground)]">
          <span>{{ mount.mountId }}（{{ describeState(mount) }}・rev {{ mount.revision }}） </span>
          <button
            hlmBtn
            variant="outline"
            size="sm"
            type="button"
            (click)="pushRequested.emit(mount.mountId)"
          >
            送る
          </button>
          <button
            hlmBtn
            variant="outline"
            size="sm"
            type="button"
            (click)="destroyRequested.emit(mount.mountId)"
          >
            外す
          </button>
        </li>
      }
    </ul>
  }
</section>
