<!-- プラグイン操作のタブ。見出し・マウント一覧・失敗一覧・再試行は出さない（代替表示の責務）。タブ切替でタグは動かさない。 -->
@if (instances().length > 0) {
  <div
    role="tablist"
    aria-label="起動中のプラグイン"
    class="flex"
    style="background: var(--secondary); border-radius: 6px; padding: 4px; gap: 8px"
  >
    @for (item of instances(); track item.instanceId; let index = $index) {
      <button
        type="button"
        role="tab"
        [id]="tabIdFor(item)"
        aria-controls="plugin-slot"
        [attr.aria-selected]="isSelected(item)"
        [attr.tabindex]="isSelected(item) ? 0 : -1"
        (click)="onSelect(item)"
        (keydown)="onTabKeydown($event, index)"
        style="border: 0; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer"
        [style.background]="isSelected(item) ? 'var(--background)' : 'transparent'"
        [style.color]="isSelected(item) ? 'var(--foreground)' : 'var(--muted-foreground)'"
        [style.font-weight]="isSelected(item) ? '600' : '400'"
      >
        {{ tabLabelFor(item) }}
        @if (hasWarning(item)) {
          <span aria-hidden="true"> ⚠</span>
          <span class="sr-only">（要確認）</span>
        }
      </button>
    }
  </div>
}
