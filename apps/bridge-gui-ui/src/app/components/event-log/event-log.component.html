<!-- 受信記録。時刻は記録時の値をそのまま示し、ここでは生成しない。 -->
<section class="flex flex-col gap-3">
  <h2 class="m-0" style="font-size: 16px; font-weight: 700; color: var(--foreground)">受信記録</h2>
  <div
    style="
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    "
  >
    <ul class="m-0 list-none p-0">
      @for (entry of entries(); track entry.id) {
        <li class="flex gap-3" style="padding: 8px 12px; border-bottom: 1px solid var(--border)">
          <span
            style="
              font-family: &quot;JetBrains Mono&quot;, monospace;
              font-size: 12px;
              color: var(--muted-foreground);
            "
            >{{ entry.time }}</span
          >
          <span
            class="flex-1"
            style="
              font-family: &quot;JetBrains Mono&quot;, monospace;
              font-size: 12px;
              color: var(--card-foreground);
            "
            >{{ entry.message }}</span
          >
        </li>
      } @empty {
        <li style="padding: 8px 12px; font-size: 12px; color: var(--muted-foreground)">
          記録は無い
        </li>
      }
    </ul>
  </div>
</section>
