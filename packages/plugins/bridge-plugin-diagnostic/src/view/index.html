<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>診断の子画面</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="plugin-diagnostic">
      <h1>診断</h1>
      <dl>
        <div>
          <dt>割当て先</dt>
          <dd id="diagnostic-assignment">未取得</dd>
        </div>
        <div>
          <dt>echo 応答</dt>
          <dd id="diagnostic-echo">未取得</dd>
        </div>
        <div>
          <dt>ping 応答</dt>
          <dd id="diagnostic-ping">未取得</dd>
        </div>
        <div>
          <dt>改訂番号</dt>
          <dd id="diagnostic-revision">未取得</dd>
        </div>
      </dl>
      <p id="diagnostic-error" class="error" aria-live="polite"></p>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
